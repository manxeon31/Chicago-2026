<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chicago 2026 Family Travel Guide</title>
  <meta name="description" content="Carry-around Chicago 2026 family travel portal with day tabs, route cards, meals, backup plans, transit notes, and Google Maps links.">
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #637184;
      --line: #d9e0e7;
      --panel: #ffffff;
      --soft: #f4f7f9;
      --blue: #1d5f86;
      --teal: #0f766e;
      --green: #43724a;
      --gold: #9a6216;
      --rose: #9f4a58;
      --shadow: 0 10px 30px rgba(23, 33, 43, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body {
      margin: 0;
      color: var(--ink);
      background: #eef3f6;
      line-height: 1.45;
      overflow-x: hidden;
    }

    a { color: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      width: 100%;
      overflow-x: hidden;
    }

    header {
      background:
        linear-gradient(120deg, rgba(15, 118, 110, .9), rgba(29, 95, 134, .85)),
        url("https://images.unsplash.com/photo-1477414348463-c0eb7f1359b6?auto=format&fit=crop&w=1800&q=80") center 42% / cover;
      color: #fff;
      padding: 22px clamp(16px, 4vw, 48px) 18px;
    }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 720px;
      margin: 10px 0 0;
      font-size: 16px;
      color: rgba(255, 255, 255, .9);
    }

    .weather-chip {
      min-width: 190px;
      border: 1px solid rgba(255, 255, 255, .3);
      background: rgba(255, 255, 255, .13);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 12px;
      text-align: right;
      font-size: 13px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .quick {
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 8px;
      padding: 11px 12px;
      background: rgba(255, 255, 255, .12);
      min-height: 74px;
      min-width: 0;
    }

    .quick b, .weather-chip b {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(255, 255, 255, .72);
      margin-bottom: 4px;
    }

    .quick span { display: block; font-weight: 700; }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(238, 243, 246, .92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
      padding: 10px clamp(12px, 4vw, 48px);
    }

    .tabs {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, minmax(86px, 1fr));
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px 9px;
      color: var(--ink);
      cursor: pointer;
      min-width: 92px;
      text-align: left;
      box-shadow: none;
      min-height: 62px;
    }

    .tab[aria-selected="true"] {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .tab strong, .tab small { display: block; }
    .tab small { color: currentColor; opacity: .72; margin-top: 2px; }

    main {
      width: min(1180px, calc(100% - 24px));
      margin: 18px auto 36px;
    }

    .day-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, .75fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
